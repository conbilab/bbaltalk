<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 확인 중 · 빨톡영어</title>
<style>
  :root{ --red:#e63535; --ink:#1a1a1a; --muted:#7a7a7a; --line:#eee; --ok:#12b76a; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
       background:#f6f7f9;color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.08);max-width:440px;width:100%;padding:38px 30px;text-align:center}
  .ico{width:74px;height:74px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:38px}
  .ico.wait{background:#fff3f3}
  .ico.ok{background:#e7f9f0}
  .ico.err{background:#fff3f3}
  h1{font-size:22px;margin:6px 0 8px}
  p{color:var(--muted);font-size:15px;line-height:1.6;margin:6px 0}
  .rows{text-align:left;margin:22px 0 6px;border-top:1px solid var(--line);padding-top:16px}
  .row{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
  .row span{color:var(--muted)}
  .row b{color:var(--ink);font-weight:700}
  .amount{font-size:26px;font-weight:800;color:var(--red);margin:8px 0 2px}
  .btns{margin-top:24px;display:flex;gap:10px}
  a.btn{flex:1;text-decoration:none;display:block;padding:14px;border-radius:12px;font-weight:700;font-size:15px}
  a.home{background:var(--red);color:#fff}
  a.kakao{background:#fee500;color:#191600}
  .spin{width:38px;height:38px;border:4px solid #f0d3d3;border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;margin:6px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .small{font-size:12px;color:#aaa;margin-top:14px}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="ico wait"><div class="spin"></div></div>
    <h1>결제를 확인하고 있어요</h1>
    <p>잠시만 기다려 주세요…</p>
  </div>

<script>
(async function () {
  var card = document.getElementById('card');
  var q = new URLSearchParams(location.search);
  var paymentKey = q.get('paymentKey');
  var orderId = q.get('orderId');
  var amount = q.get('amount');

  function won(n){ try { return '₩' + Number(n).toLocaleString('ko-KR'); } catch(e){ return '₩' + n; } }

  function showSuccess(data) {
    var name = (data && data.orderName) ? data.orderName : '빨톡영어 수업';
    var paidAmount = (data && data.totalAmount != null) ? data.totalAmount : amount;
    var method = (data && data.method) ? data.method : '카드';
    card.innerHTML =
      '<div class="ico ok">✅</div>' +
      '<h1>결제가 완료되었어요!</h1>' +
      '<p>수강 신청이 정상적으로 접수되었습니다.</p>' +
      '<div class="amount">' + won(paidAmount) + '</div>' +
      '<div class="rows">' +
        '<div class="row"><span>주문명</span><b>' + escapeHtml(name) + '</b></div>' +
        '<div class="row"><span>결제수단</span><b>' + escapeHtml(method) + '</b></div>' +
        '<div class="row"><span>주문번호</span><b style="font-size:12px">' + escapeHtml(orderId) + '</b></div>' +
      '</div>' +
      '<div class="btns">' +
        '<a class="btn kakao" href="https://open.kakao.com/o/spBZLsU" target="_blank">카톡으로 문의</a>' +
        '<a class="btn home" href="/index.html">홈으로</a>' +
      '</div>' +
      '<div class="small">결제 영수증은 카드사/토스에서 확인하실 수 있어요.</div>';
  }

  function showFail(msg) {
    card.innerHTML =
      '<div class="ico err">⚠️</div>' +
      '<h1>결제 확인에 실패했어요</h1>' +
      '<p>' + escapeHtml(msg || '결제 승인 중 문제가 발생했습니다.') + '</p>' +
      '<p class="small">결제가 실제로 이뤄졌는데 이 화면이 보인다면, 카카오톡으로 주문번호와 함께 알려주세요.<br>주문번호: ' + escapeHtml(orderId || '-') + '</p>' +
      '<div class="btns">' +
        '<a class="btn kakao" href="https://open.kakao.com/o/spBZLsU" target="_blank">카톡으로 문의</a>' +
        '<a class="btn home" href="/index.html">홈으로</a>' +
      '</div>';
  }

  function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  // 필수 정보 확인
  if (!paymentKey || !orderId || !amount) {
    showFail('결제 정보가 올바르지 않습니다.');
    return;
  }

  try {
    // 서버(/api/confirm)에 최종 승인 요청
    var res = await fetch('/api/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paymentKey: paymentKey, orderId: orderId, amount: Number(amount) }),
    });
    var data = await res.json();

    if (res.ok) {
      showSuccess(data);
    } else {
      showFail((data && data.message) ? data.message : '결제 승인에 실패했습니다.');
    }
  } catch (e) {
    showFail('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
  }
})();
</script>
</body>
</html>
